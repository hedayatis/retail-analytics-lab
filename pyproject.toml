[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-lab"
version = "1.1.0"
description = "Reproducible retail analytics on UCI Online Retail II: contracts, star schema, and cross-engine Python/SQL/R parity checks."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "duckdb>=0.10",
    "pyreadr>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
retail-lab = "retail_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
