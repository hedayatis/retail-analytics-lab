name: pipeline

# The parity harness is the reason this workflow exists: it runs the base-R
# implementations under webR (R compiled to WebAssembly, installed from npm) and
# diffs them against the Python outputs. That means the R leg is verified on
# every push without installing R or reaching a CRAN mirror on the runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run the pipeline
        run: make pipeline

      - name: Contract report
        run: cat data/reports/data_quality.md

      - name: Cleaning ledger
        run: column -s, -t < data/reports/cleaning_ledger.csv || cat data/reports/cleaning_ledger.csv

      - name: Cross-implementation parity (Python / SQL / stdlib / base R)
        run: |
          cd lab && npm install --no-audit --no-fund
          node run_r_parity.mjs

      - name: Test suite
        run: make test

      - name: Build the browser lab bundle
        run: make lab

      - name: Dashboard calculations and source-rendering regressions
        run: cd lab && npm test

      - uses: actions/upload-artifact@v4
        with:
          name: run-reports
          path: data/reports/
